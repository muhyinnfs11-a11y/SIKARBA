<style>
:root{--red:#1565B8;--deep:#0A2F66;--gold:#F2A91B;--gold2:#FFD36E;--bg:#F3F8FC;--card:#fff;--ink:#11233F;--mut:#5E7088;--line:#D9E5F0;--ok:#3C8D1F;--warn:#C77A00;--bad:#C0262D}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
aside{width:260px;background:linear-gradient(170deg,#0B3470,#071F46);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:5px;flex-shrink:0;transition:transform .25s;z-index:20}
.brand{display:flex;flex-direction:column;text-align:center;gap:8px;align-items:center;padding:0 6px 16px;border-bottom:1px solid rgba(242,210,122,.25);margin-bottom:10px}
.brand img{width:108px;filter:drop-shadow(0 6px 10px #0006)}
.brand b{display:block;font-size:16px;line-height:1.2;color:var(--gold2);letter-spacing:.5px}
.brand span{font-size:11px;opacity:.8}
.badge-pro{background:rgba(255,211,110,.2);color:var(--gold2);border:1px solid var(--gold);padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:0;background:none;color:#dbe7f5;border-radius:12px;cursor:pointer;font-weight:600;text-align:left;transition:.15s}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:linear-gradient(90deg,var(--gold),#E8BC45);color:var(--deep);font-weight:700}
nav svg{width:18px;height:18px;flex-shrink:0}
.side-foot{margin-top:auto;font-size:11px;opacity:.75;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.1);line-height:1.5}
main{flex:1;min-width:0}
header{display:flex;gap:10px;align-items:center;padding:14px 28px;background:rgba(243,248,252,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
#menu{display:none;border:0;background:var(--red);color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:12px;background:#fff}
.search svg{position:absolute;left:12px;top:11px;width:17px;color:var(--mut)}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:12.5px}
.pill:hover{background:#f0f6fc}
.dot{width:9px;height:9px;border-radius:50%;background:#b5a9a4}.pill.on .dot{background:var(--ok);box-shadow:0 0 0 4px #1e8e5a22}
section{padding:24px 28px 50px;max-width:1280px}
h1{font-size:24px;font-weight:800;letter-spacing:-.4px}h1+p{color:var(--mut);margin:4px 0 20px}
.btn{border:0;background:var(--red);color:#fff;padding:9px 16px;border-radius:11px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px -6px var(--red);display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn:hover{background:var(--deep)}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.alt:hover{background:#eef5fc}
.btn.gold{background:var(--gold);color:var(--deep);box-shadow:none}.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border-radius:16px;padding:16px 18px;border:1px solid var(--line);position:relative;overflow:hidden}
.stat:first-child{background:linear-gradient(135deg,var(--red),var(--deep));color:#fff;border:0}
.stat small{opacity:.8;font-weight:600;font-size:12px}.stat b{display:block;font-size:28px;margin-top:4px;font-weight:800}
.stat:first-child b{color:var(--gold2)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:12px 14px;background:#F6FAFE;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid #E6EEF6;vertical-align:middle}tr:last-child td{border:0}
tbody tr:hover{background:#F1F7FD}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#F7E6B8;color:#7a5600}
.tag.Baik,.tag.in,.tag.Selesai,.tag.Aktif{background:#DFF1D3;color:var(--ok)}
.tag.Rusak.Ringan,.tag.Penting,.tag.Proses{background:#FFEBC9;color:var(--warn)}
.tag.Rusak.Berat,.tag.Segera,.tag.Rahasia,.tag.Inaktif{background:#FBD9DB;color:var(--bad)}
.tag.out,.tag.Biasa{background:#DCE8FB;color:#24508f}
.ic{border:0;background:#E8F0F8;border-radius:8px;padding:6px 8px;cursor:pointer;margin-right:3px;font-size:13px}.ic:hover{background:var(--gold2)}
a{color:var(--red);font-weight:600;text-decoration:none}
.empty{text-align:center;padding:42px 16px;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
dialog{border:0;border-radius:20px;padding:0;width:min(680px,95vw);box-shadow:0 30px 80px -20px #000a}
dialog::backdrop{background:#06193a99}
dialog form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:90vh;overflow-y:auto}
dialog h2{grid-column:1/-1;font-size:18px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-title{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--red);text-transform:uppercase;margin-top:6px;letter-spacing:.5px}
label{font-weight:600;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}label.w{grid-column:1/-1}
label input,label select,label textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-weight:500}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.acts{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.bars div{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}.bars i{display:block;height:9px;border-radius:9px;background:var(--gold)}
.bars span{width:110px}.bars em{font-style:normal;font-weight:700;margin-left:auto}
ol{padding-left:20px;line-height:1.8}code{background:#E8F0F8;padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;bottom:22px;right:22px;background:var(--deep);color:#fff;padding:12px 18px;border-radius:12px;border-left:5px solid var(--gold);opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:999}#toast.show{opacity:1;transform:none}
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#1673C4 0,#0A2F66 50%,#061B3E 100%);padding:16px}
#login[hidden]{display:none}
#lf{background:#fff;border-radius:24px;padding:32px 28px;width:min(400px,100%);display:grid;gap:14px;text-align:center;box-shadow:0 40px 90px -30px #000;border-top:6px solid var(--gold)}
#lf img{width:120px;margin:-76px auto 0;filter:drop-shadow(0 8px 12px #0004)}
#lf h2{font-size:22px;font-weight:800;margin-top:4px}#lf p{color:var(--mut);margin-top:-8px}#lf label{text-align:left}#lf .btn{padding:12px;justify-content:center}
#le{color:var(--bad);font-weight:600;font-size:13px}
#vdlg{width:min(800px,95vw)}#vbox{padding:24px;max-height:88vh;overflow:auto}
.vh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.vh h2{font-size:19px;margin-top:6px}
dl{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;background:#F6FAFE;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}dt{color:var(--mut);font-weight:600}dd{margin:0;font-weight:500}
#vbox h4{margin:14px 0 8px}.isi{white-space:pre-wrap;line-height:1.7;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px 16px}
#vbox iframe{width:100%;height:460px;border:1px solid var(--line);border-radius:12px;background:#f4f4f4}
.yf{padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:600;font-size:13px}
.warn-box{background:#FFF8E6;border:1px solid #F5D487;border-left:4px solid var(--gold);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.5}
@media(max-width:860px){aside{position:fixed;transform:translateX(-100%)}aside.open{transform:none}#menu{display:block}.grid2{grid-template-columns:1fr}section,header{padding-left:16px;padding-right:16px}dialog form{grid-template-columns:1fr}.pill span{display:none}}
</style>

  db.logs.unshift({waktu:new Date().toLocaleString('id-ID'), aksi, detail});
  if(db.logs.length>100) db.logs.pop();
}

function toast(m){
  const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3400);
}
function save(){
  let ok=true;
  try{localStorage.setItem(K,JSON.stringify(db))}
  catch(e){
    ok=false;
    toast('⚠️ Penyimpanan perangkat penuh, data belum tersimpan. Unduh Backup JSON, hubungkan Google Drive, atau hapus berkas lokal yang besar.');
  }
  clearTimeout(save.t);
  if(ok&&tok&&Date.now()<exp) save.t=setTimeout(()=>syncUp(true),1500);
  return ok;
}
function saveCfg(){try{localStorage.setItem(C,JSON.stringify(cfg))}catch(e){}}

function cekRetensi(d){
  if(!d.retensi || d.retensi==='Permanen') return 'Aktif';
  const thnArsip = parseInt(dy(d)) || NOW;
  const durasi = parseInt(d.retensi) || 5;
  return (NOW - thnArsip >= durasi) ? 'Inaktif' : 'Aktif';
}

/* ---------- Render Halaman ---------- */
function render(){
  nav();
  const v=$('#view');
  if(view==='dash') v.innerHTML=dash();
  else if(view==='aset') v.innerHTML=assets();
  else if(view==='drive') v.innerHTML=drivePage();
  else if(view==='log') v.innerHTML=logPage();
  else if(view==='akun') v.innerHTML=akunPage();
  else v.innerHTML=docs(view);
  setStatus();
}

function bukaForm(type,id){
  const isA=type==='aset', item=(isA?db.assets:db.docs).find(x=>x.id===id)||{};
  if(!isA&&item.id) item.tahun=dy(item);

  let defNomor = item.nomor || '';
  if(!id && type==='Surat Keluar'){
    const urut = String(db.docs.filter(d=>d.kat==='Surat Keluar' && dy(d)===String(NOW)).length + 1).padStart(3,'0');
    defNomor = `421.2/${urut}/SDN1-BU/${NOW}`;
  }

  const f=(n,l,t='text',w='',x='',ph='')=>`<label class="${w}">${l}<input name="${n}" type="${t}" value="${esc(item[n]??x)}" placeholder="${esc(ph)}" ${t==='number'?'min="0"':''}></label>`;
  const sel=(n,l,o,w='')=>`<label class="${w}">${l}<select name="${n}">${o.map(v=>`<option ${String(item[n])===String(v)?'selected':''}>${v}</option>`).join('')}</select></label>`;

  $('#frm').innerHTML = isA ? `
    <h2>${id?'Ubah':'Tambah'} Data Aset & Inventaris</h2>
    ${f('nama','Nama Barang / Aset *','text','w','','Misal: Laptop Chromebook / Meja Siswa')}
    ${f('kode','Kode Barang / No. Register','text','','','02.06.01.01')}
    ${sel('kategori','Kategori Aset',['Peralatan Kelas','Elektronik & IT','Buku & Perpustakaan','Alat Olahraga & Seni','Kendaraan','Tanah & Bangunan','Lainnya'])}
    ${f('jumlah','Jumlah Unit','number','',1)}
    ${sel('kondisi','Kondisi Fisik',KONDISI)}
    ${f('lokasi','Lokasi / Ruangan','text','','','Misal: Ruang Guru / Kelas VI')}
    ${sel('sumber','Sumber Dana',['Dana BOS','APBD / Dinas','Hibah / Komite','Lainnya'])}
    ${sel('tahun','Tahun Perolehan',yrs(1980,item.tahun))}
    ${f('harga','Harga Satuan (Rp)','number','')}
    <label class="w">Keterangan / Spesifikasi<textarea name="ket" rows="2">${esc(item.ket||'')}</textarea></label>
  ` : `
    <h2>${id?'Ubah':'Rekam'} ${type}</h2>
    <div class="sec-title">1. Identitas & Klasifikasi Naskah</div>
    ${f('tanggal','Tanggal Surat','date','',item.tanggal||new Date().toISOString().slice(0,10))}
    ${sel('tahun','Tahun Arsip',yrs(1990,item.tahun))}
    ${f('nomor','Nomor Surat / Dokumen','text','',defNomor,'Contoh: 421.2/015/SDN1-BU/2026')}
    ${sel('klas','Kode Klasifikasi Arsip',KLAS)}
    ${sel('sifat','Sifat Surat',SIFAT)}
    ${sel('retensi','Jadwal Retensi Arsip (JRA)',RETENSI)}
    ${f('perihal','Perihal / Judul Dokumen *','text','w','','Ringkasan pokok surat')}
    ${f('pihak',type==='Surat Masuk'?'Instansi / Pihak Pengirim':type==='Surat Keluar'?'Instansi / Pihak Tujuan':'Pihak Terkait / Nama Guru/Siswa','text','')}
    ${f('lokasiFisik','Lokasi Simpan Fisik (Map/Boks/Rak)','text','','','Contoh: Lemari A - Boks 02 - Map Biru')}

    ${type==='Surat Masuk'?`
    <div class="sec-title">2. Lembar Disposisi & Tindak Lanjut</div>
    ${f('dispTujuan','Diteruskan Kepada','text','','','Contoh: Wali Kelas VI / Bendahara BOS')}
    ${sel('dispStatus','Status Disposisi',['Belum Diproses','Proses','Selesai'])}
    ${f('dispCatatan','Instruksi / Catatan Kepala Sekolah','text','w','','Contoh: Harap dihadiri / Tindak lanjuti sesuai juknis')}
    `:''}

    <div class="sec-title">3. Ringkasan Isi & Lampiran Digital</div>
    <label class="w">Isi Ringkas Surat<textarea name="isi" rows="3" placeholder="Ketik pokok isi surat agar mudah dicari dan dibaca langsung...">${esc(item.isi||'')}</textarea></label>
    <label class="w">Keterangan Tambahan<textarea name="ket" rows="2">${esc(item.ket||'')}</textarea></label>
    <label class="w">Unggah Berkas Scan (PDF / JPG / PNG)
      ${item.file?`<small style="color:var(--ok)">Saat ini terlampir: <b>${esc(item.file.name)}</b>. Pilih file baru jika ingin mengganti.</small>`:'<small>Otomatis diunggah ke Google Drive jika terhubung, atau disimpan lokal jika ukuran &lt; 2MB.</small>'}
      <input type="file" name="file" accept=".pdf,image/*,.doc,.docx,.xls,.xlsx">
    </label>
  `;

  $('#frm').insertAdjacentHTML('beforeend',`<div class="acts"><button type="button" class="btn alt" value="x">Batal</button><button class="btn" id="ok" value="ok">💾 Simpan Data</button></div>`);
  $('#frm').querySelector('[name=nama],[name=perihal]').required=true;
  $('#dlg').showModal();

  if(!isA){
    const fm=$('#frm');
    fm.tanggal.onchange=()=>{if(fm.tanggal.value)fm.tahun.value=fm.tanggal.value.slice(0,4)};
    fm.tahun.onchange=()=>{const d=fm.tanggal.value;fm.tanggal.value=fm.tahun.value+(d?d.slice(4):'-01-01')};
  }

  $('#ok').onclick=async e=>{
    e.preventDefault();
    const fm=$('#frm');
    if(!fm.reportValidity()) return;
    const d=Object.fromEntries(new FormData(fm));
    const file=d.file; delete d.file;
    const rec={...item,...d,id:item.id||uid(),created:item.created||Date.now()};
    if(!isA) rec.kat=type;

    if(file && file.size){
      $('#ok').textContent='Memproses berkas…';
      $('#ok').disabled=true;
      if((tok && Date.now()<exp) || (cfg.clientId && cfg.granted)){
        try{
          const r=await upload(file,file.name,file.type);
          rec.file={name:file.name,id:r.id,link:r.webViewLink};
        }catch(er){
          toast('Gagal unggah ke Drive ('+er.message+'). Mencoba simpan lokal...');
          if(file.size <= 2*1024*1024){
            rec.file={name:file.name,type:file.type,data:await toBase64(file)};
          }else{
            $('#ok').textContent='💾 Simpan Data'; $('#ok').disabled=false; return;
          }
        }
      } else if(file.size <= 2*1024*1024){
        rec.file={name:file.name,type:file.type,data:await toBase64(file)};
        toast('Disimpan di memori lokal (Hubungkan Drive untuk kapasitas besar).');
      } else {
        toast('Ukuran file > 2MB! Hubungkan Google Drive terlebih dahulu.');
        $('#ok').textContent='💾 Simpan Data'; $('#ok').disabled=false; return;
      }
    }

    const arr=isA?db.assets:db.docs, i=arr.findIndex(x=>x.id===rec.id), prev=i>=0?arr[i]:null;
    i>=0 ? arr[i]=rec : arr.unshift(rec);
    logAct(id?'Mengubah Data':'Menambah Data', `${type}: ${rec.perihal||rec.nama}`);
    if(!save()){
      if(i>=0) arr[i]=prev; else arr.shift();
      db.logs.shift();
      $('#ok').textContent='💾 Simpan Data'; $('#ok').disabled=false;
      return;
    }
    $('#dlg').close(); render();
    toast('Data berhasil disimpan'+(rec.file?.id?' & terunggah ke Google Drive':''));
  };
}

function toBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

function del(t,id){
  const item=db[t].find(x=>x.id===id);
  if(confirm(`Hapus "${item?.perihal||item?.nama||'data ini'}"? Berkas di Google Drive tidak ikut terhapus.`)){
    db[t]=db[t].filter(x=>x.id!==id);
    logAct('Menghapus Data', item?.perihal||item?.nama||id);
    save(); render(); toast('Data berhasil dihapus');
  }
}

function exportCSV(kat){
  const isA = kat==='aset';
  const rows = isA
    ? [['Kode','Nama Barang','Kategori','Sumber Dana','Jumlah','Kondisi','Lokasi','Tahun','Harga Satuan','Keterangan'],
       ...db.assets.map(a=>[a.kode,a.nama,a.kategori,a.sumber,a.jumlah,a.kondisi,a.lokasi,a.tahun,a.harga,a.ket])]
    : [['Tanggal','Tahun','Nomor Surat','Kode Klasifikasi','Sifat','Perihal','Pengirim/Tujuan','Lokasi Fisik','Retensi','Tujuan Disposisi','Status Disposisi','Ringkasan Isi'],
       ...db.docs.filter(d=>d.kat===kat).map(d=>[d.tanggal,dy(d),d.nomor,d.klas,d.sifat,d.perihal,d.pihak,d.lokasiFisik,d.retensi,d.dispTujuan,d.dispStatus,d.isi])];

  const csv = '\uFEFF' + rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`SIKARBA_${kat.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('Tabel berhasil diekspor ke CSV (Excel)');
}

function exportJSON(){

function importJSON(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.docs && !d.assets) throw new Error('Format JSON tidak valid');
      if(confirm(`Pulihkan ${d.docs?.length||0} dokumen dan ${d.assets?.length||0} aset dari file cadangan?`)){
        db={docs:d.docs||[],assets:d.assets||[],logs:d.logs||[]};
        logAct('Impor Backup Lokal', file.name);
        const okSave=save(); render(); if(okSave) toast('Database berhasil dipulihkan!');
      }
    }catch(er){toast('Gagal membaca file: '+er.message)}
  };
  r.readAsText(file);
}

/* ---------- Integrasi Server Penyimpanan Google Drive ---------- */
function setStatus(){
  const on=tok&&Date.now()<exp;
  $('#drv').classList.toggle('on',!!on);
  $('#drvt').textContent=on?'Terhubung ke Drive':'Drive belum terhubung';
}

function loadGIS(){
  return new Promise((r,j)=>{
    if(window.google?.accounts) return r();
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=r;
    s.onerror=()=>j(new Error('Gagal memuat Google SDK. Periksa koneksi internet Anda.'));
    document.head.appendChild(s);
  });
}

async function auth(force){
  if(location.protocol==='file:'){
    throw new Error('OAuth Google tidak bisa berjalan di mode file://. Klik 2x Jalankan_Aplikasi_Windows.bat atau buka lewat hosting.');
  }
  if(!force && tok && Date.now()<exp-60000) return tok;
  if(!cfg.clientId) throw new Error('Masukkan Google Client ID terlebih dahulu di menu Cloud & Backup');
  await loadGIS();
  return new Promise((res,rej)=>google.accounts.oauth2.initTokenClient({
    client_id:cfg.clientId,
    scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{
      if(r.error) return rej(new Error(r.error));
      tok=r.access_token;
      exp=Date.now()+r.expires_in*1000;
      setStatus();
      res(tok);
    },
    error_callback:e=>rej(new Error(e.type||'Otorisasi Google dibatalkan'))
  }).requestAccessToken({prompt:cfg.granted?'':'consent'}));
}

async function gapi(url,opt={}){
  const t=await auth();
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});
  if(!r.ok) throw new Error('Google Drive Error '+r.status);
  return r;
}

const FILES='https://www.googleapis.com/drive/v3/files';
async function find(name,parent,mime){
  const safeName = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const qq=`name='${safeName}' and trashed=false`+(mime?` and mimeType='${mime}'`:'')+(parent?` and '${parent}' in parents`:'');
  return (await(await gapi(FILES+'?fields=files(id)&q='+encodeURIComponent(qq))).json()).files[0]?.id;
}

async function folder(){
  if(cfg.folderId) return cfg.folderId;
  const n='Arsip SDN 1 Baharu Utara', M='application/vnd.google-apps.folder';
  let id=await find(n,null,M);
  if(!id) id=(await(await gapi(FILES,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,mimeType:M})})).json()).id;
  cfg.folderId=id; saveCfg(); return id;
}

async function upload(blob,name,mime,id){
  const f=await folder(), b='b'+Date.now(), meta=id?{name}:{name,parents:[f]};
  const body=new Blob([`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${b}--`]);
  return (await gapi(`https://www.googleapis.com/upload/drive/v3/files${id?'/'+id:''}?uploadType=multipart&fields=id,webViewLink`,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json();
}

async function syncUp(silent){
  try{
    let r;
    try{
      r=await upload(new Blob([JSON.stringify(db)]),'data-arsip.json','application/json',cfg.dataId);
    }catch(e){
      cfg.dataId=null;
      r=await upload(new Blob([JSON.stringify(db)]),'data-arsip.json','application/json');
    }
    cfg.dataId=r.id; cfg.last=new Date().toLocaleString('id-ID'); saveCfg();
    logAct('Sinkronisasi Cloud','Unggah data-arsip.json ke Google Drive');
    toast(silent?'Otomatis tersinkron ke Google Drive':'Berhasil dicadangkan ke Google Drive!');
    if(view==='drive') render();
  }catch(e){toast('Gagal mencadangkan ke Drive: '+e.message)}
}

async function syncDown(){
  try{
    const f=await folder();
    const id=cfg.dataId||await find('data-arsip.json',f);
    if(!id) return toast('Belum ditemukan file data-arsip.json di Google Drive Anda');
    const d=await(await gapi(FILES+'/'+id+'?alt=media')).json();
    if(!confirm(`Ditemukan cadangan Cloud berisi ${d.docs?.length||0} dokumen dan ${d.assets?.length||0} aset. Timpa data di perangkat ini?`)) return;
    db={docs:d.docs||[],assets:d.assets||[],logs:d.logs||[]};
    cfg.dataId=id; saveCfg(); save(); render();
    toast('Data berhasil dimuat dari Google Drive!');
  }catch(e){toast('Gagal memuat dari Drive: '+e.message)}
}

  const v=$('#cid')?.value.trim();
  if(v){cfg.clientId=v; saveCfg()}
  try{
    await auth(true); cfg.granted=1; await folder(); saveCfg();
    toast('Berhasil terhubung ke Google Drive!'); render();
  }catch(e){toast(e.message)}
}

/* ---------- Autentikasi & Pengaturan Instansi ---------- */
async function hs(s){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sdn1bu|'+s));
    return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){return btoa(unescape(encodeURIComponent('sdn1bu|'+s)))}
}

async function boot(){
  try{
    if(!adm){adm={user:'admin',pass:await hs('admin123')};try{localStorage.setItem(A,JSON.stringify(adm))}catch(e){}}
    let ok=false; try{ok=sessionStorage.getItem('ok')==='1'}catch(e){}
    $('#login').hidden=ok;
    if(!ok) $('#lu').focus();
  }catch(e){console.error('boot:',e)}
}

$('#lf').onsubmit=async e=>{
  e.preventDefault(); await ready;

    logAct('Login','Operator masuk ke sistem'); save();

};

};

document.addEventListener('submit',async e=>{
  if(e.target.id==='pf'){
    e.preventDefault();
    cfg.namaSekolah=$('#p_nama').value.trim();
    cfg.alamatSekolah=$('#p_alamat').value.trim();
    cfg.kepsek=$('#p_kepsek').value.trim();
    cfg.nipKepsek=$('#p_nip').value.trim();
    saveCfg(); toast('Profil sekolah berhasil disimpan'); render();
  }
  if(e.target.id==='af'){
    e.preventDefault();
    if(await hs($('#ao').value)!==adm.pass) return toast('Kata sandi saat ini salah!');
    adm={user:$('#au').value.trim(),pass:await hs($('#an').value)};
    localStorage.setItem(A,JSON.stringify(adm));
    toast('Kredensial akun berhasil diperbarui'); render();
  }
});

render();
</script>
</body>
</html>
